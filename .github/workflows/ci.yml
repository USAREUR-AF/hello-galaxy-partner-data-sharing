name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: the drivers parse and pass shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n and shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n lib/hello-zenoh.sh bin/hello-zenoh patterns/*/run.sh
          shellcheck -x -S warning lib/hello-zenoh.sh bin/hello-zenoh patterns/*/run.sh
